<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAM CITY — 3D capability map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
  /* palette pulled straight from BAM's index.html :root */
  :root{
    --bg:#010008; --bg2:#05000f;
    --red:#6b0020; --red-h:#a3143a; --red-b:rgba(100,0,30,.35);
    --gold:#8a6800; --gold-h:#e2c05c; --gold-b:rgba(138,104,0,.32);
    --panel:rgba(4,0,14,.97);
    --text:#eedcd8; --text-d:rgba(230,200,200,.7); --muted:rgba(200,90,90,.55);
    --mono: 'Courier New', ui-monospace, Menlo, monospace;
    --serif: 'Cinzel', serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--mono);font-size:14px}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* HUD — matches BAM's crimson-panel look */
  .hud{position:fixed;top:14px;left:16px;z-index:5;pointer-events:none;user-select:none;
       background:var(--panel);border:1px solid var(--red-b);border-left:2px solid var(--red);
       border-radius:10px;padding:12px 16px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
  .hud h1{margin:0;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.55em;
       color:var(--red);text-transform:uppercase;text-shadow:0 0 12px rgba(140,0,30,.55)}
  .hud .sub{margin-top:5px;font-size:8.5px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
  .hud .truth{margin-top:10px;font-size:9.5px;letter-spacing:.14em;color:var(--text-d)}
  .hud .truth b{color:var(--gold-h);font-weight:700;text-shadow:0 0 8px rgba(184,134,11,.4)}

  .note{position:fixed;top:14px;right:16px;z-index:5;font-size:9px;letter-spacing:.14em;
        color:var(--text-d);text-align:right;max-width:260px;line-height:1.8;pointer-events:none;
        background:var(--panel);border:1px solid var(--red-b);border-right:2px solid var(--gold);
        padding:10px 14px;border-radius:10px}

  .bar{position:fixed;bottom:14px;left:16px;right:16px;z-index:5;display:flex;gap:14px;
       align-items:center;flex-wrap:wrap;font-size:9px;letter-spacing:.14em;color:var(--text-d);
       text-transform:uppercase;background:var(--panel);border:1px solid var(--red-b);
       border-radius:10px;padding:10px 14px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
  .bar button{font:inherit;letter-spacing:.14em;text-transform:uppercase;background:rgba(50,0,15,.4);
       color:var(--gold-h);border:1px solid var(--red-b);padding:7px 12px;cursor:pointer;
       border-radius:6px;transition:all .15s}
  .bar button:hover{border-color:var(--red-h);color:#fff;background:rgba(90,10,30,.55)}
  .bar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .bar button.on{color:#fff;border-color:var(--red-h);background:linear-gradient(135deg,rgba(120,0,30,.55),rgba(80,0,20,.35));
       box-shadow:0 0 12px rgba(140,0,30,.4)}
  .bar i{width:8px;height:8px;display:inline-block;margin-right:5px;vertical-align:-1px;border-radius:50%}
  .sun{display:flex;align-items:center;gap:10px}
  .sun input{-webkit-appearance:none;appearance:none;width:170px;height:2px;
       background:linear-gradient(90deg,#12040c,#a3143a 45%,#e2c05c 55%,#12040c);outline:none}
  .sun input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold-h);cursor:pointer;border:2px solid var(--bg)}
  .sun input::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--gold-h);cursor:pointer;border:2px solid var(--bg)}
  .sun b{color:var(--gold-h);font-weight:700;min-width:52px}
  .hint{color:rgba(230,200,200,.35);text-transform:none;letter-spacing:.06em}

  /* district legend — mirrors the APPS drawer sections */
  .districts{position:fixed;top:110px;left:16px;z-index:5;display:flex;flex-direction:column;gap:4px;
              font-size:8px;letter-spacing:.35em;text-transform:uppercase;pointer-events:none;
              font-weight:700}
  .districts span{padding:5px 10px 5px 22px;background:var(--panel);border-left:2px solid;
       position:relative;border-radius:0 6px 6px 0}
  .districts span::before{content:'';position:absolute;left:8px;top:50%;width:6px;height:6px;
       border-radius:50%;transform:translateY(-50%);background:currentColor;
       box-shadow:0 0 8px currentColor}

  .tip{position:fixed;z-index:6;pointer-events:none;padding:6px 10px;background:var(--panel);
       border:1px solid var(--red-b);border-left:2px solid var(--red);border-radius:5px;
       font-size:9px;letter-spacing:.15em;color:var(--text);
       white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity .12s}
  .bub{position:fixed;z-index:6;pointer-events:none;padding:5px 9px;background:var(--panel);
       border:1px solid var(--gold-b);font-size:8.5px;letter-spacing:.08em;color:var(--gold-h);
       white-space:nowrap;transform:translate(-50%,-100%);border-radius:5px}

  /* side panel — reads like the BAM app's biz-panel style */
  #panel{position:fixed;z-index:7;top:0;right:0;height:100%;width:360px;padding:30px 26px;
    background:linear-gradient(90deg,rgba(4,0,14,0) 0%,var(--panel) 22%);
    border-left:1px solid var(--red-b);
    transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
  #panel.open{transform:none}
  #panel h2{margin:40px 0 4px;font-family:var(--serif);font-size:16px;font-weight:700;
    letter-spacing:.24em;text-transform:uppercase}
  #panel .st{font-size:9px;letter-spacing:.24em;text-transform:uppercase}
  #panel .meta{font-size:9px;letter-spacing:.14em;color:rgba(200,90,90,.5);margin-bottom:8px}
  #panel .district{display:inline-block;font-size:8.5px;letter-spacing:.32em;text-transform:uppercase;
    padding:3px 10px;margin-bottom:20px;border:1px solid currentColor;border-radius:3px;font-weight:700}
  #panel .icon{font-size:22px;margin-right:8px;vertical-align:-3px}
  .role{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid rgba(100,0,30,.25)}
  .role .n{font-size:8px;color:rgba(200,90,90,.35);letter-spacing:.1em;width:16px;font-weight:700}
  .role .r{font-size:10px;letter-spacing:.14em;text-transform:uppercase;flex:1}
  .role .who{font-size:8px;letter-spacing:.13em;text-align:right;max-width:150px;line-height:1.5;font-weight:700}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
  #panel .foot{margin-top:24px;font-size:9px;letter-spacing:.10em;color:rgba(200,90,90,.45);line-height:1.9;
    padding-top:14px;border-top:1px solid rgba(100,0,30,.3)}
  #panel .close{position:absolute;top:26px;right:26px;font:inherit;font-size:9px;letter-spacing:.24em;
    text-transform:uppercase;background:transparent;border:1px solid var(--red-b);
    color:var(--text-d);padding:6px 10px;cursor:pointer;border-radius:4px;font-weight:700}
  #panel .close:hover{color:#fff;border-color:var(--red-h);background:rgba(90,0,20,.3)}
  input[type=file]{display:none}

  /* build modal — matches BAM cfg-sec */
  #build{position:fixed;z-index:8;top:50%;left:50%;transform:translate(-50%,-50%) scale(.94);
    width:min(420px,92vw);background:var(--panel);border:1px solid var(--red-b);border-left:2px solid var(--red);
    border-radius:12px;padding:22px 22px 18px;box-shadow:0 40px 80px rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:opacity .18s, transform .18s cubic-bezier(.2,.9,.3,1)}
  #build.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #build h3{margin:0 0 4px;font-family:var(--serif);font-size:14px;letter-spacing:.32em;color:var(--red);text-transform:uppercase}
  #build .subh{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
  #build .row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
  #build label{flex:0 0 78px;font-size:9px;letter-spacing:.14em;color:var(--text-d);text-transform:uppercase}
  #build input,#build select,#build textarea{flex:1;background:rgba(100,0,0,.08);border:1px solid var(--red-b);
    color:var(--text);border-radius:6px;font:inherit;font-size:12px;padding:7px 9px;outline:none}
  #build input:focus,#build select:focus,#build textarea:focus{border-color:var(--red-h)}
  #build textarea{min-height:52px;resize:vertical;font-family:var(--mono)}
  #build .btns{display:flex;gap:8px;margin-top:14px}
  #build .btns button{flex:1;font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    padding:9px;cursor:pointer;border-radius:6px}
  #build .cancel{background:transparent;border:1px solid var(--red-b);color:var(--text-d)}
  #build .cancel:hover{border-color:var(--red-h);color:#fff}
  #build .random{background:linear-gradient(135deg,rgba(90,40,10,.5),rgba(60,20,5,.4));
    border:1px solid var(--gold-b);color:var(--gold-h)}
  #build .random:hover{border-color:var(--gold-h);color:#fff}
  #build .go{background:linear-gradient(135deg,var(--red),#3a0010);border:1px solid var(--red-h);
    color:#fff;font-weight:700;text-shadow:0 0 8px rgba(120,0,30,.6)}
  #build .go:hover{box-shadow:0 0 18px rgba(140,0,30,.5)}
  .backdrop{position:fixed;inset:0;z-index:7;background:rgba(2,0,6,.55);opacity:0;pointer-events:none;transition:opacity .18s}
  .backdrop.open{opacity:1;pointer-events:auto}

  /* toast */
  #toasts{position:fixed;right:20px;bottom:80px;z-index:8;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{background:var(--panel);border:1px solid var(--gold-b);border-left:3px solid var(--gold-h);
    padding:10px 14px;border-radius:8px;font-size:10px;letter-spacing:.16em;color:var(--gold-h);
    text-transform:uppercase;opacity:0;transform:translateX(20px);
    transition:opacity .3s, transform .3s;box-shadow:0 12px 26px rgba(0,0,0,.5);max-width:290px;line-height:1.6}
  .toast.on{opacity:1;transform:none}
  .toast .name{color:#fff;letter-spacing:.1em;font-weight:700}

  @media (max-width:680px){#panel{width:100%} .sun input{width:110px} .districts{display:none} .note{max-width:180px}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud">
  <h1>BAM City</h1>
  <div class="sub">Every drawer app · every service · every mind</div>
  <div class="truth" id="truth"></div>
</div>

<div class="districts" id="districts"></div>

<div class="note" id="note"></div>

<div class="bar">
  <div class="sun">
    <span>sun</span>
    <input type="range" id="time" min="0" max="24" step="0.1" value="10">
    <b id="clock">10:00</b>
  </div>
  <button id="bDay" class="on">Day</button>
  <button id="bDusk">Dusk</button>
  <button id="bNight">Night</button>
  <button id="grow">＋ Grow</button>
  <button id="auto" title="BAM builds a new tower every 8 seconds">▶ Auto</button>
  <button id="fix" title="Rename dupes · upgrade user stubs to live · staff every unstaffed tower">🔧 Backfill</button>
  <button id="load">Load city_state.json</button>
  <button id="reset">Reset view</button>
  <button id="wipe" title="Clear BAM's saved additions and restore the seed city">Wipe</button>
  <span><i style="background:#e2c05c;box-shadow:0 0 6px #e2c05c"></i>live</span>
  <span><i style="background:#a3143a;box-shadow:0 0 6px #a3143a"></i>working</span>
  <span><i style="background:#5a5560"></i>stub</span>
  <span class="hint">daylight shows every tower — night shows which ones are alive</span>
</div>
<input type="file" id="file" accept=".json">

<div class="tip" id="tip"></div>

<aside id="panel">
  <button class="close" id="close">Close</button>
  <div id="pbody"></div>
</aside>

<div class="backdrop" id="backdrop"></div>
<div id="build">
  <h3>Grow BAM City</h3>
  <div class="subh">Add a new tower — or let BAM invent one</div>
  <div class="row"><label>District</label><select id="bDist"></select></div>
  <div class="row"><label>Name</label><input id="bName" placeholder="e.g. Kokoro TTS"></div>
  <div class="row"><label>Icon</label><input id="bIcon" placeholder="🎵" maxlength="4" style="flex:0 0 90px"></div>
  <div class="row"><label>Status</label>
    <select id="bStatus"><option value="live">live — spawns a mind to staff it</option><option value="stub">stub — spec only, no mind</option></select>
  </div>
  <div class="row"><label>Priority</label><input id="bPrio" type="number" min="1" max="5" value="3" style="flex:0 0 90px"></div>
  <div class="row"><label>Queue</label><input id="bQueue" type="number" min="0" value="0" style="flex:0 0 90px"></div>
  <div class="row"><label>Drawer?</label>
    <select id="bPrimary" style="flex:0 0 200px"><option value="0">no — backend service</option><option value="1">yes — drawer app</option></select>
  </div>
  <div class="row"><label>Roles</label><textarea id="bRoles" placeholder="comma-separated · e.g. synthesize, cache, stream"></textarea></div>
  <div class="btns">
    <button class="cancel" id="bCancel">Cancel</button>
    <button class="random" id="bRandom">🎲 Let BAM pick</button>
    <button class="go" id="bGo">＋ Build</button>
  </div>
</div>

<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==================================================================
   BAM CITY 3D — mirrors the BAM app: same 6 drawer sections as districts,
   same crimson/gold palette, same icons. Renders city_state.json,
   invents nothing, and every backend service tucks in with its drawer app.
================================================================== */

const RED=0xa3143a, GOLD=0xe2c05c, WORKING=0xff5570;

/* Districts — EXACT drawer sections + order from /Users/bam/Downloads/index.html.
   Positioned as a hexagonal ring around the central COMMAND CORE. */
const RING_R = 110;
const DISTRICTS=[
  {id:'work',     name:'WORK',     icon:'💼', color:'#e2c05c', hex:0xe2c05c, ang:-Math.PI/2},                // north
  {id:'life',     name:'LIFE',     icon:'⚡', color:'#c58a3a', hex:0xc58a3a, ang:-Math.PI/2+Math.PI/3},      // ne
  {id:'security', name:'SECURITY', icon:'🛡', color:'#a3143a', hex:0xa3143a, ang:-Math.PI/2+2*Math.PI/3},    // se
  {id:'mind',     name:'MIND',     icon:'🧠', color:'#7b2b5a', hex:0x7b2b5a, ang:Math.PI/2},                 // south
  {id:'ship',     name:'SHIP',     icon:'🚀', color:'#c07028', hex:0xc07028, ang:Math.PI/2+Math.PI/3},       // sw
  {id:'senses',   name:'SENSES',   icon:'👁', color:'#d0a058', hex:0xd0a058, ang:-Math.PI/2-Math.PI/3}       // nw
];
DISTRICTS.forEach(d=>{ d.x=Math.cos(d.ang)*RING_R; d.z=Math.sin(d.ang)*RING_R; });
DISTRICTS.push({id:'core',name:'COMMAND CORE',icon:'⌸',color:'#e2c05c',hex:0xe2c05c,x:0,z:0});
const D_LOOKUP=Object.fromEntries(DISTRICTS.map(d=>[d.id,d]));

/* SEED — Every APPS-drawer button = a primary tower.
   Backend/infrastructure = smaller supporting towers tucked into the same district.
   Icons match the drawer emoji so the city reads like the app. */
const SEED={
  modules:[
    /* ═══ WORK — /Users/bam/Downloads/index.html §1877 ═══ */
    {id:'ventures',  district:'work', icon:'💰', name:'Ventures',        status:'live', priority:5, queue:4, primary:true,  roles:['50 money plays','status cycle','playbook chat','wired to hands']},
    {id:'webagent',  district:'work', icon:'🕹', name:'Web Agent',       status:'live', priority:5, queue:2, primary:true,  roles:['playwright headed','data-bam tags','approval gates','route trail']},
    {id:'leadssites',district:'work', icon:'🏢', name:'Leads & Sites',   status:'live', priority:4, queue:2, primary:true,  roles:['find leads','enrich','pitch','build site','pipeline']},
    {id:'ytstudio',  district:'work', icon:'📹', name:'YouTube Studio',  status:'live', priority:5, queue:2, primary:true,  roles:['plan','make','From-Bam approval','publish']},
    {id:'blood',     district:'work', icon:'🩸', name:'Blood Terminal',  status:'live', priority:5, queue:6, primary:true,  roles:['paper positions','mark-to-market','settlement','risk rails']},
    {id:'ledger',    district:'work', icon:'💵', name:'Finance Ledger',  status:'live', priority:3, queue:0, roles:['append-only','24h aggregate']},
    {id:'strat',     district:'work', icon:'🎲', name:'Strategy Lab',    status:'live', priority:3, queue:0, roles:['10 strategies','whale leaderboard','weekly standings']},
    {id:'gumroad',   district:'work', icon:'🛒', name:'Gumroad Publish', status:'stub', priority:5, queue:0, roles:['listing','asset','payout — BLOCKED']},

    /* ═══ LIFE — §1883 ═══ */
    {id:'powers',    district:'life', icon:'⚡', name:'Powers',          status:'live', priority:5, queue:0, primary:true,  roles:['body','mind','life','home','family','world','builds']},

    /* ═══ SECURITY — §1885 ═══ */
    {id:'sentinel',  district:'security', icon:'🛡', name:'Sentinel',    status:'live', priority:5, queue:0, primary:true,  roles:['token age','tunnel status','authfail count','lockdown']},
    {id:'tripwire',  district:'security', icon:'🚨', name:'Tripwire',    status:'live', priority:5, queue:0, roles:['honeypots','8-fail rule','auto-lockdown','threat log']},
    {id:'creds',     district:'security', icon:'🔐', name:'Creds Vault', status:'live', priority:5, queue:0, roles:['AES-256-GCM','Keychain key','migrate + destroy plaintext']},
    {id:'backup',    district:'security', icon:'💾', name:'Backup',      status:'live', priority:4, queue:0, roles:['tar + openssl','keep 14','iCloud copy']},
    {id:'authgate',  district:'security', icon:'🚫', name:'IP Blocker',  status:'live', priority:4, queue:0, roles:['30-min block','8 bad/hr','honeypot 401']},
    {id:'hashwatch', district:'security', icon:'🔍', name:'Hash Alarm',  status:'live', priority:3, queue:0, roles:['md5 core files','diff-stat alert']},
    {id:'kill',      district:'security', icon:'⏻',  name:'Killswitch',  status:'live', priority:5, queue:0, roles:['lockdown flag','tunnel down','no restart']},

    /* ═══ MIND — §1887 ═══ */
    {id:'brain',     district:'mind', icon:'🧠', name:'Brain',           status:'live', priority:3, queue:0, primary:true,  roles:['local jv-brain','Mac facts','category']},
    {id:'ideas1k',   district:'mind', icon:'💡', name:'1000 Ideas',      status:'live', priority:2, queue:0, primary:true,  roles:['50 domains','search','status chips','0 built']},
    {id:'academy',   district:'mind', icon:'🎓', name:'Academy',         status:'live', priority:5, queue:0, primary:true,  roles:['11 lineage minds','teach','exam','trait','spawn agent']},
    {id:'doom',      district:'mind', icon:'🌀', name:'Doomscroll',      status:'live', priority:2, queue:0, primary:true,  roles:['insights','videos','games']},
    {id:'neuro',     district:'mind', icon:'🧬', name:'Neurolink',       status:'live', priority:3, queue:0, primary:true,  roles:['cortex','tools','agents']},
    {id:'physics',   district:'mind', icon:'⚛', name:'Physics Lab',      status:'live', priority:2, queue:0, primary:true,  roles:['portal engineering','speculative chemistry']},
    {id:'memory',    district:'mind', icon:'🧿', name:'Memory Spine',    status:'live', priority:5, queue:0, roles:['nomic-embed','vector store','recall inject','25k cap']},
    {id:'research',  district:'mind', icon:'🔬', name:'Deep Research',   status:'live', priority:5, queue:1, roles:['Firecrawl','DDG fallback','Jina reader','fact extract']},
    {id:'lessons',   district:'mind', icon:'📖', name:'Post-Mortems',    status:'live', priority:3, queue:0, roles:['journal tail','lesson extract','inject on next task']},
    {id:'rules',     district:'mind', icon:'📏', name:'Rules Extractor', status:'live', priority:2, queue:0, roles:['detect pushback','imperative rule','store']},
    {id:'viewest',   district:'mind', icon:'📊', name:'View Estimator',  status:'live', priority:3, queue:0, roles:['self-calibrate','history features','predict']},

    /* ═══ SHIP — §1894 ═══ */
    {id:'threedee',  district:'ship', icon:'🌐', name:'3D World',        status:'live', priority:5, queue:0, primary:true,  roles:['this city','holographic core','navigator']},
    {id:'deck',      district:'ship', icon:'⌸',  name:'Command Deck',    status:'live', priority:5, queue:0, primary:true,  roles:['every panel at once','decision bar','one-yes UX']},
    {id:'missions',  district:'ship', icon:'🎯', name:'Missions',        status:'live', priority:5, queue:2, roles:['70B plan 2-6 steps','approve/abort','step runner']},
    {id:'const',     district:'ship', icon:'📜', name:'Constitution',    status:'live', priority:5, queue:0, roles:['11 rules','inject into agent','safety layer']},
    {id:'codes',     district:'ship', icon:'🛠', name:'BAM CODES',        status:'live', priority:5, queue:0, roles:['claude -p headless','snapshot + restore','reviewer','deploy']},
    {id:'routines',  district:'ship', icon:'⏰', name:'Routines',        status:'live', priority:3, queue:0, roles:['time + day','queue agent tasks']},
    {id:'queue',     district:'ship', icon:'📦', name:'Agent Queue',     status:'live', priority:4, queue:1, roles:['poll 25s','next when idle','journal']},
    {id:'fallback',  district:'ship', icon:'🔀', name:'Model Fallback',  status:'live', priority:4, queue:0, roles:['70B → 8b-instant → local 3B','light path']},

/* ---------------- sun / time of day ---------------- */
const C={
  nightTop:new THREE.Color(0x040713), nightMid:new THREE.Color(0x0a0812), nightBot:new THREE.Color(0x1a0812),
  duskTop:new THREE.Color(0x2a1030),  duskMid:new THREE.Color(0x6b1030),  duskBot:new THREE.Color(0xff7a3c),
  dayTop:new THREE.Color(0x1c3a6e),   dayMid:new THREE.Color(0x8ea6c8),   dayBot:new THREE.Color(0xe4c8a8),
  nightGround:new THREE.Color(0x0a0508), dayGround:new THREE.Color(0x1a0e14),
  /* buildings: warm crimson-stone tone in daylight, near-black at night */
  nightLive:new THREE.Color(0x14080f),  dayLive:new THREE.Color(0xb28068),
  nightStub:new THREE.Color(0x0a060c),  dayStub:new THREE.Color(0x605058),
  dawnSun:new THREE.Color(0xff8a3d),    noonSun:new THREE.Color(0xfff4e2)
};
let hour=10, daylight=1;

function setTime(h){
  hour=h;
  const ang=((h-6)/12)*Math.PI;
  const up=Math.sin(ang);
  daylight=Math.max(0,Math.min(1,up*1.35));
  const dusky=Math.max(0,Math.min(1,1-Math.abs(up)*2.6));

  sun.position.set(Math.cos(ang)*180, Math.max(-60,up*160), 80);
  sun.intensity=daylight*1.7;
  sun.color.copy(C.dawnSun).lerp(C.noonSun,Math.min(1,daylight*1.4));
  sun.castShadow=daylight>0.06;
  sunDisc.position.copy(sun.position).multiplyScalar(4.4);
  sunDisc.lookAt(0,0,0);
  sunDisc.material.color.copy(sun.color);
  sunDisc.visible=up>-0.05;
  sunDisc.material.opacity=Math.max(0,Math.min(1,0.15+daylight+dusky*0.6));

  moon.intensity=Math.max(0,1-daylight)*0.55;
  ambient.intensity=0.08+daylight*0.68;
  fill.intensity=0.45-daylight*0.25;
  coreGlow.intensity=(1-daylight)*1.5;

  skyUniforms.topColor.value.copy(C.nightTop).lerp(C.duskTop,dusky).lerp(C.dayTop,daylight);
  skyUniforms.midColor.value.copy(C.nightMid).lerp(C.duskMid,dusky).lerp(C.dayMid,daylight);
  skyUniforms.botColor.value.copy(C.nightBot).lerp(C.duskBot,dusky).lerp(C.dayBot,daylight);
  scene.fog.color.copy(skyUniforms.midColor.value);
  scene.fog.density=0.0028+(1-daylight)*0.0058;

  stars.material.opacity=Math.max(0,1-daylight*2.2);

  groundMat.color.copy(C.nightGround).lerp(C.dayGround,daylight);
  grid.material.opacity=0.06+daylight*0.24;

  const lampOn=Math.max(0, 1-daylight*1.4);
  lamps.forEach(l=>{
    l.bulb.color.setRGB(0.10+lampOn*0.95, 0.09+lampOn*0.7, 0.06+lampOn*0.4);
    l.puddle.opacity=lampOn*0.55;
  });

  beacons.forEach(b=>{ b.baseOpacity=0.35+(1-daylight)*0.65; });

  towers.forEach(t=>{
    const live=t.status==='live';
    t.mesh.material.color.copy(live?C.nightLive:C.nightStub)
      .lerp(live?C.dayLive:C.dayStub,daylight);
    t.mesh.material.emissiveIntensity=live?(1-daylight)*1.25:0;
    (t.tops||[]).forEach(m=>{
      m.material.color.copy(live?C.nightLive:C.nightStub)
        .lerp(live?C.dayLive:C.dayStub,daylight);
      m.material.emissiveIntensity=live?(1-daylight)*1.25:0;
    });
    t.edge.material.opacity=live?(0.32+(1-daylight)*0.6):(0.14+daylight*0.38);
    t.edge.material.color.setHex(live?(daylight>.4?0x6b1030:0x8a3020):(daylight>.4?0x3a2028:0x180810));
    if(t.cap) t.cap.material.color.setHex(live? (daylight>.5?t.districtHex:GOLD) : (daylight>.5?0x3a2028:0x180810));
  });
  agents.forEach(a=>{
    const work=a.status==='working';
    a.halo.material.opacity=work?(0.30+(1-daylight)*0.65):(0.10+(1-daylight)*0.18);
  });

  const hh=Math.floor(h)%24, mm=Math.floor((h%1)*60);
  document.getElementById('clock').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

/* ---------------- camera orbit ---------------- */
const cam={theta:-0.7,phi:0.95,r:220,target:new THREE.Vector3(0,4,0)};
const goal={theta:-0.7,phi:0.95,r:220,target:new THREE.Vector3(0,4,0)};
function applyCam(){
  cam.theta+=(goal.theta-cam.theta)*.12;
  cam.phi  +=(goal.phi-cam.phi)*.12;
  cam.r    +=(goal.r-cam.r)*.09;
  cam.target.lerp(goal.target,.09);
  camera.position.set(
    cam.target.x+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta),
    cam.target.y+cam.r*Math.cos(cam.phi),
    cam.target.z+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta));
  camera.lookAt(cam.target);
}

/* ---------------- textures ---------------- */
const facadeCache={};
function windowTex(live,ratio,style){
  const key=live+'_'+Math.round(ratio*100)+'_'+style;
  if(facadeCache[key]) return facadeCache[key];
  const cw=128,ch=256,c=document.createElement('canvas');
  c.width=cw;c.height=ch;const x=c.getContext('2d');
  // per-facade dark backing so each material reads as its own texture
  const bg={
    glass:['#160a12','#251420'],
    concrete:'#180a10',
    brick:'#2a1218',
    stone:'#221820',
    obsidian:'#0a0a12',
    copper:'#2a1408'
  }[style]||'#180a10';
  if(Array.isArray(bg)){
    const g=x.createLinearGradient(0,0,cw,ch);
    g.addColorStop(0,bg[0]); g.addColorStop(1,bg[1]); x.fillStyle=g;
  } else x.fillStyle=bg;
  x.fillRect(0,0,cw,ch);
  x.fillStyle='rgba(0,0,0,.4)';
  for(let y=0;y<ch;y+=16) x.fillRect(0,y,cw,1);

  const cols=(style==='glass'||style==='obsidian')?10:8;
  const rows=32;
  const cellW=cw/cols, cellH=ch/rows;
  const pw=cellW*0.7, ph=cellH*0.55;
  const offCol={
    glass:'#1a0e18', concrete:'#12070d', brick:'#1a0810',
    stone:'#1a0f14', obsidian:'#0f0f18', copper:'#1a0a04'
  }[style]||'#12070d';
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const px=k*cellW+(cellW-pw)/2, py=r*cellH+(cellH-ph)/2;
    const s=r*cols+k+style.charCodeAt(0);
    if(!live){
      x.fillStyle=offCol;
    } else {
      const lit=((s*13929)%97)/97 < ratio;
      // gold-dominant, crimson accents — every style shares the BAM palette
      x.fillStyle = lit ? (s%9===0 ? '#a3143a' : s%5===0 ? '#ffcf6a' : '#e2c05c') : offCol;
    }
    x.fillRect(px,py,pw,ph);
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.encoding=THREE.sRGBEncoding;
  facadeCache[key]=t; return t;
}
function glowTex(rgb){
  const s=64,c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,`rgba(${rgb},1)`);g.addColorStop(.35,`rgba(${rgb},.45)`);g.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=g;x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
const GOLD_GLOW=glowTex('226,192,92'), RED_GLOW=glowTex('163,20,58'),
      DIM_GLOW=glowTex('120,80,90'),  BEACON_GLOW=glowTex('255,60,80');

    x.textAlign='center'; x.textBaseline='middle';
    x.fillText(emoji, s/2, s/2+4);
    tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding;
    iconTexCache[emoji]=tex;
  }
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.setScalar(4.5);
  return sp;
}

/* ---------------- world ---------------- */
let state=null,towers=[],agents=[],msgs=[],focus=null,hover=null,usingSeed=true,clock=0;
let beacons=[];
const world=new THREE.Group(); scene.add(world);
const pickables=[];

function ingest(raw){
  state={
    modules:(raw.modules||[]).filter(m=>m&&m.id).map(m=>({
      id:m.id, name:m.name||m.id, district:m.district||'ship',
      icon:m.icon||'▦', primary:!!m.primary,
      status:(m.status==='live'||m.status===true)?'live':'stub',
      priority:m.priority||1, queue:m.queue||0,
      roles:(m.roles&&m.roles.length)?m.roles:['(no roles declared)']})),
    agents:(raw.agents||[]).filter(a=>a&&a.id).map(a=>({
      id:a.id, name:a.name||a.id, skills:a.skills||[],
      assignment:a.assignment||null, status:a.status||'idle', floor:a.floor??0})),
    messages:raw.messages||[]
  };
  build(); paintTruth(); paintDistricts(); setTime(hour);
}

function paintDistricts(){
  const box=document.getElementById('districts');
  const inCity={};
  state.modules.forEach(m=>{ inCity[m.district]=(inCity[m.district]||0)+1; });
  box.innerHTML=DISTRICTS.filter(d=>d.id!=='core' && inCity[d.id]).map(d=>{
    return `<span style="color:${d.color};border-color:${d.color}">${d.icon} ${d.name} · ${inCity[d.id]}</span>`;
  }).join('');
}

/* Full-string ID hash — so 'usr_lg3z2h8_a2b' and 'usr_lg3z2h8_c1d' pick different styles */
function idHash(id){
  let h=2166136261;
  for(let i=0;i<id.length;i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

/* Six real facades — each with its own base color, roughness, metalness */
const FACADES=[
  {style:'glass',    color:0x2a3a58, roughness:.28, metalness:.55},
  {style:'concrete', color:0x604048, roughness:.85, metalness:.15},
  {style:'brick',    color:0x3a1820, roughness:.90, metalness:.10},
  {style:'stone',    color:0x4a3a3f, roughness:.78, metalness:.12},
  {style:'obsidian', color:0x14141a, roughness:.35, metalness:.65},
  {style:'copper',   color:0x5a2a1a, roughness:.42, metalness:.75}
];

/* ---- procedural tower — all pieces in one Group so BAM can grow/dispose it ---- */
function makeTower(m, cx, cz){
  const live=m.status==='live';
  const dist=D_LOOKUP[m.district]||D_LOOKUP.ship;
  const primary=!!m.primary;

  // hash the FULL id + name so every tower reads as its own building
  const h  = idHash(m.id + '|' + m.name);
  const h1 = (h >> 3) & 0xff;
  const h2 = (h >> 11) & 0xff;
  const h3 = (h >> 19) & 0xff;

  // shaft footprint varies +/- 30% (was fixed)
  const baseW=(primary?9:7) + Math.min(3,m.priority);
  const w = baseW + (h1 % 5) - 2;   // -2 … +2
  const d = baseW + (h2 % 5) - 2;
  const totalH = (primary? 22 : 14) + m.priority*(primary?5:3) + (h3 % 11);

  const face=FACADES[h % FACADES.length];
  const style=face.style;

  const staff=state.agents.filter(a=>a.assignment===m.id&&a.status==='working').length;
  const ratio=live?Math.min(.85,.22+staff*.22):0;

  const g=new THREE.Group();
  const disposables=[];   // {mat?, geo?} for cleanup on remove
  const track=(mesh)=>{ if(mesh.material)disposables.push({mat:mesh.material}); if(mesh.geometry)disposables.push({geo:mesh.geometry}); return mesh; };

  const plinthH=3;
  const plinth=track(new THREE.Mesh(new THREE.BoxGeometry(w+2,plinthH,d+2),
    new THREE.MeshStandardMaterial({color:0x2a0e18,roughness:.9,metalness:.15})));
  plinth.position.set(cx,plinthH/2,cz); plinth.castShadow=true; plinth.receiveShadow=true;
  g.add(plinth);

  if(live){
    const lintel=track(new THREE.Mesh(new THREE.BoxGeometry(w*.7,.3,d+2.15),
      new THREE.MeshBasicMaterial({color:dist.hex,transparent:true,opacity:.7})));
    lintel.position.set(cx, 0.4, cz);
    g.add(lintel);
  }

  const shaftH=totalH*0.62;
  const tex=windowTex(live,ratio,style);
  tex.repeat.set(2, Math.max(3, Math.round(shaftH/5)));
  const mat=new THREE.MeshStandardMaterial({
    color: face.color,
    roughness: face.roughness,
    metalness: face.metalness,
    emissive:0xffffff, emissiveMap:tex, emissiveIntensity:0,
    map: live?null:tex
  });
  const shaft=track(new THREE.Mesh(new THREE.BoxGeometry(w,shaftH,d),mat));
  shaft.position.set(cx, plinthH+shaftH/2, cz);
  shaft.castShadow=true; shaft.receiveShadow=true;
  shaft.userData.id=m.id;
  g.add(shaft); pickables.push(shaft);

  const trimMat=new THREE.MeshStandardMaterial({color:0x0a0508,roughness:.4,metalness:.7});
  disposables.push({mat:trimMat});
  const trimGeo=new THREE.BoxGeometry(.3,shaftH,.3);
  disposables.push({geo:trimGeo});
  for(const [sx,sz] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
    const t=new THREE.Mesh(trimGeo,trimMat);
    t.position.set(cx+sx*w/2, plinthH+shaftH/2, cz+sz*d/2);
    g.add(t);
  }

  const s1H=totalH*0.24, s1W=w*0.78, s1D=d*0.78;
  const tex1=windowTex(live,ratio*0.9,style);
  tex1.repeat.set(2, Math.max(2,Math.round(s1H/5)));
  const s1Mat=mat.clone(); s1Mat.emissiveMap=tex1; s1Mat.map=live?null:tex1;
  disposables.push({mat:s1Mat});
  const set1=track(new THREE.Mesh(new THREE.BoxGeometry(s1W,s1H,s1D),s1Mat));
  set1.position.set(cx, plinthH+shaftH+s1H/2, cz);
  set1.castShadow=true; set1.receiveShadow=true;
  g.add(set1);
  // set1 was tracked with s1Mat AGAIN in track — but disposing twice is safe

  let set2=null;
  const tops=[set1];
  if(m.priority>=4 || primary){
    const s2H=totalH*0.14, s2W=w*0.55, s2D=d*0.55;
    const tex2=windowTex(live,ratio*0.8,style);
    tex2.repeat.set(2,Math.max(1,Math.round(s2H/5)));
    const s2Mat=mat.clone(); s2Mat.emissiveMap=tex2; s2Mat.map=live?null:tex2;
    set2=track(new THREE.Mesh(new THREE.BoxGeometry(s2W,s2H,s2D),s2Mat));
    set2.position.set(cx, plinthH+shaftH+s1H+s2H/2, cz);
    set2.castShadow=true; set2.receiveShadow=true;
    g.add(set2); tops.push(set2);
  }

  const roofY = plinthH+shaftH+s1H+(set2? set2.geometry.parameters.height : 0);
  const roofMat=new THREE.MeshStandardMaterial({color:0x1e1218,roughness:.85,metalness:.2});
  disposables.push({mat:roofMat});
  const hvac=track(new THREE.Mesh(new THREE.BoxGeometry(w*.35,1.2,d*.4),roofMat));
  hvac.position.set(cx-w*.12, roofY+0.6, cz+d*.12); hvac.castShadow=true;
  g.add(hvac);
  const tank=track(new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,2.2,10),roofMat));
  tank.position.set(cx+w*.18, roofY+1.1, cz-d*.15); tank.castShadow=true;
  g.add(tank);

  const antH=live? 4+m.priority*(primary?1.6:1.1) : 3;
  const antMat=new THREE.MeshStandardMaterial({color:0x120a10,roughness:.4,metalness:.85});
  disposables.push({mat:antMat});
  const ant=track(new THREE.Mesh(new THREE.CylinderGeometry(.08,.14,antH,8),antMat));
  ant.position.set(cx, roofY+antH/2, cz);
  g.add(ant);
  const beaconMesh=track(new THREE.Mesh(new THREE.SphereGeometry(.35,10,10),
    new THREE.MeshBasicMaterial({color:0xff3050,transparent:true,opacity:.4})));
  beaconMesh.position.set(cx, roofY+antH+0.2, cz);
  g.add(beaconMesh);
  const beaconGlow=new THREE.Sprite(new THREE.SpriteMaterial({
    map:BEACON_GLOW,transparent:true,opacity:.2,depthWrite:false,blending:THREE.AdditiveBlending}));
  beaconGlow.scale.setScalar(3.6);
  beaconGlow.position.copy(beaconMesh.position);
  disposables.push({mat:beaconGlow.material});
  g.add(beaconGlow);
  const beaconEntry={mesh:beaconMesh, phase:Math.random()*6.28, baseOpacity:.4, glow:beaconGlow};
  beacons.push(beaconEntry);

  const cap=track(new THREE.Mesh(new THREE.BoxGeometry(2.6,0.32,2.6),
    new THREE.MeshBasicMaterial({color:live?dist.hex:0x3a2028})));
  cap.position.set(cx, roofY+0.18, cz); g.add(cap);

  if(primary && m.icon){
    const iconSp=iconSprite(m.icon);
    iconSp.position.set(cx, roofY+antH+3.4, cz);
    iconSp.scale.setScalar(primary?5:3.5);
    disposables.push({mat:iconSp.material});
    g.add(iconSp);
  }

  const edgeGeo=new THREE.EdgesGeometry(shaft.geometry);
  disposables.push({geo:edgeGeo});
  const edgeMat=new THREE.LineBasicMaterial({color:0x6b1030,transparent:true,opacity:.5});
  disposables.push({mat:edgeMat});
  const edge=new THREE.LineSegments(edgeGeo, edgeMat);
  edge.position.copy(shaft.position); g.add(edge);

  const slabs=new THREE.Group(); slabs.visible=false;
  m.roles.forEach((role,fi)=>{
    const fy=plinthH+((shaftH)/(m.roles.length+1))*(fi+1);
    const slab=track(new THREE.Mesh(new THREE.BoxGeometry(w*.94,.22,d*.94),
      new THREE.MeshBasicMaterial({color:live?0x3a1a26:0x2e1a24,transparent:true,opacity:.9})));
    slab.position.set(cx,fy,cz); slabs.add(slab);
    const occupied=state.agents.some(a=>a.assignment===m.id&&a.status==='working'&&a.floor===fi);
    const spMat=new THREE.SpriteMaterial({
      map:occupied?GOLD_GLOW:DIM_GLOW,transparent:true,
      opacity:occupied?.95:.28,depthWrite:false,blending:THREE.AdditiveBlending});
    disposables.push({mat:spMat});
    const sp=new THREE.Sprite(spMat);
    sp.scale.setScalar(occupied?4.6:2.6);
    sp.position.set(cx,fy+1.6,cz); slabs.add(sp);
  });
  g.add(slabs);

  world.add(g);

  return {
    id:m.id, group:g, mesh:shaft, tops, edge, cap, slabs, cx, cz, h:roofY, w,
    district:m.district, districtHex:dist.hex, disposables, beaconEntry,
    growth:{t:1, target:1}   // default full-grown; addTower overrides for animation
  };
}

/* ═══════════════════════════════════════════════════════════════════
   COLLISION-SAFE WEDGE PLACEMENT
   Each of the 6 districts owns a 60° wedge from CORE (0,0).
   findSlot spirals outward inside the wedge until it hits empty space.
   No tower ever overlaps another — the city sprawls outward forever.
═══════════════════════════════════════════════════════════════════ */
const WEDGE = Math.PI * 2 / 6;
const WEDGE_GAP = 0.06;   // small buffer between neighboring districts
const TOWER_MIN_GAP = 4;  // walkway padding between towers

function footprintRadius(w, primary){
  return (w||8) * 0.71 + TOWER_MIN_GAP + (primary?1:0);
}
function collides(x, z, r){
  for(const t of towers){
    const other = footprintRadius(t.w, t.primary);
    const dx = x - t.cx, dz = z - t.cz;
    if(dx*dx + dz*dz < (r + other)*(r + other)) return true;
  }
  return false;
}
function findSlot(dId, primary, footprint){
  const d = D_LOOKUP[dId] || D_LOOKUP.ship;
  const centerAng = Math.atan2(d.z, d.x);           // angle of district plaza from core
  const halfWedge = WEDGE/2 - WEDGE_GAP;
  // primaries land near/at the plaza; backend starts just past it
  const startR = primary ? RING_R - 6 : RING_R + 22;
  for(let r = startR; r < 4000; r += 3){
    const arcLen = 2 * halfWedge * r;
    const steps = Math.max(6, Math.min(80, Math.floor(arcLen / 11)));
    for(let i = 0; i < steps; i++){
      // ping-pong offsets: 0, +1, -1, +2, -2 … keeps growth centered in wedge
      const half = Math.floor(i/2);
      const sign = i%2===0 ? 1 : -1;
      const off  = half / Math.max(1, Math.floor(steps/2));
      const ang  = centerAng + sign * off * halfWedge;
      const x = Math.cos(ang) * r;
      const z = Math.sin(ang) * r;
      if(!collides(x, z, footprint)) return {x, z};
    }
  }
  // last-resort — should never fire because search goes to 4000
  return {x:d.x, z:d.z};
}

/* build a single tower — used both at startup and when BAM grows the city */
function addTower(m, opts={}){
  const existing=towers.find(t=>t.id===m.id);
  if(existing){ updateTowerFields(existing, m); return existing; }

  const primary=!!m.primary;
  const w=(primary?9:7) + Math.min(3, m.priority||1);
  const fp=footprintRadius(w, primary);
  const pos = (m.cx!==undefined && m.cz!==undefined)
    ? {x:m.cx, z:m.cz}
    : findSlot(m.district, primary, fp);
  const built=makeTower(m, pos.x, pos.z);
  const tower={...m, ...built};
  towers.push(tower);
  tower.growth = {t: opts.instant ? 1 : 0.02, target: 1};
  tower.group.scale.y = tower.growth.t;
  return tower;
}

function updateTowerFields(t, patch){
  Object.assign(t, patch);
  // if status flipped, cap color needs a refresh via setTime pass
  setTime(hour);
}

/* dispose a tower's meshes/materials and remove from the scene */
function disposeTower(t){
  if(!t) return;
  world.remove(t.group);
  t.disposables.forEach(d=>{ if(d.mat)d.mat.dispose(); if(d.geo)d.geo.dispose(); });
  const bi=beacons.indexOf(t.beaconEntry); if(bi>=0) beacons.splice(bi,1);
  const pi=pickables.indexOf(t.mesh); if(pi>=0) pickables.splice(pi,1);
  const ti=towers.indexOf(t); if(ti>=0) towers.splice(ti,1);
}

/* full rebuild — used on ingest() and wipe */
function build(){
  // dispose existing towers cleanly
  [...towers].forEach(disposeTower);
  towers.length=0; pickables.length=0; agents.length=0; msgs.length=0; beacons.length=0;
  // also strip static world children so ingest can safely rebuild center + agents
  while(world.children.length) world.remove(world.children[0]);
  document.querySelectorAll('.bub').forEach(n=>n.remove());
  // primaries first (they claim inner-ring slots), then backend
  const primaries=state.modules.filter(m=>m.primary);
  const backend=state.modules.filter(m=>!m.primary);
  [...primaries, ...backend].forEach(m=>addTower(m, {instant:true}));

  /* CENTER — the JARVIS command core arc-reactor beacon */
  const coreRing=new THREE.Mesh(
    new THREE.TorusGeometry(6,0.35,16,64),
    new THREE.MeshStandardMaterial({color:0xa3143a,emissive:0xa3143a,emissiveIntensity:.9,roughness:.3,metalness:.7}));
  coreRing.rotation.x=Math.PI/2; coreRing.position.set(0,2.5,0); world.add(coreRing);
  const coreRing2=new THREE.Mesh(
    new THREE.TorusGeometry(4,0.28,16,64),
    new THREE.MeshStandardMaterial({color:0xe2c05c,emissive:0xe2c05c,emissiveIntensity:.7,roughness:.3,metalness:.7}));
  coreRing2.rotation.x=Math.PI/2; coreRing2.position.set(0,2.8,0); world.add(coreRing2);
  const coreOrb=new THREE.Mesh(new THREE.SphereGeometry(1.6,32,32),
    new THREE.MeshBasicMaterial({color:0xffe8c0}));
  coreOrb.position.set(0,2.6,0); world.add(coreOrb);
  const coreOrbGlow=new THREE.Sprite(new THREE.SpriteMaterial({
    map:GOLD_GLOW,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));
  coreOrbGlow.scale.setScalar(14); coreOrbGlow.position.copy(coreOrb.position); world.add(coreOrbGlow);

  /* AGENTS — each mind spawns next to its tower, spaced out if there's a crew */
  const crewCount={};
  state.agents.forEach((a,i)=>{
    const work=a.status==='working';
    const dot=new THREE.Mesh(new THREE.SphereGeometry(.7,16,16),
      new THREE.MeshBasicMaterial({color:work?0xffcf5a:0x604048}));
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({
      map:work?GOLD_GLOW:DIM_GLOW,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending}));
    halo.scale.setScalar(work?7.2:4);
    const lc=document.createElement('canvas'); lc.width=256; lc.height=64;
    const lx=lc.getContext('2d');
    lx.font='700 22px "Courier New",monospace';
    lx.textAlign='center'; lx.fillStyle=work?'#e2c05c':'#8a6070';
    lx.shadowColor='#000'; lx.shadowBlur=6;
    lx.fillText(a.name, 128, 34);
    const lt=new THREE.CanvasTexture(lc); lt.encoding=THREE.sRGBEncoding;
    const lbl=new THREE.Sprite(new THREE.SpriteMaterial({map:lt,transparent:true,depthWrite:false}));
    lbl.scale.set(6,1.5,1); lbl.position.set(0,2.6,0);

    const g=new THREE.Group(); g.add(dot); g.add(halo); g.add(lbl);
    const t=towers.find(x=>x.id===a.assignment);
    // if multiple minds staff the same tower, spread them out around its base
    const k=(crewCount[a.assignment]||0); crewCount[a.assignment]=k+1;
    const angle = k * 1.05;   // ~60° apart, then further out for more
    const r = 6 + k*1.4;
    const home=t? new THREE.Vector3(t.cx + Math.cos(angle)*r, 1.5, t.cz + Math.sin(angle)*r)
                : new THREE.Vector3(-150+i*8,1.5,150);
    g.position.copy(home); world.add(g);
    agents.push({...a,obj:g,dot,halo,lbl,goal:home.clone(),phase:Math.random()*6.28});
  });

  msgs=(state.messages||[]).slice(-6).map(m=>({...m,life:1.5+Math.random()*4,el:null}));
  frameCity();
}

function frameCity(){ goal.target.set(0,10,0); goal.r=280; goal.phi=0.95; goal.theta=-0.7; }

function paintTruth(){
  const live=state.modules.filter(m=>m.status==='live').length;
  const work=state.agents.filter(a=>a.status==='working').length;
  const pop=state.modules.length;
  document.getElementById('truth').innerHTML=
    `population <b>${pop}</b> · <b>${live}</b> live · <b>${work}</b> / ${state.agents.length} minds working`;
  document.getElementById('note').textContent=usingSeed
    ? 'no city_state.json found — showing the BAM app itself. every drawer app is a tower; every ＋ Grow adds one more; the city sprawls outward without limit.'
    : 'live from city_state.json — poll every 30s';
}

/* ---------------- scheduler ---------------- */
function schedule(){
  const open=towers.filter(t=>t.status==='live'&&t.queue>0);
  agents.forEach(a=>{
    if(a.status==='working')return;
    let best=null,bs=0;
    open.forEach(t=>{
      const fit=(FIT[t.id]||[]).some(s=>a.skills.includes(s))?1:.25;
      const taken=agents.filter(x=>x.assignment===t.id).length;
      const sc=t.priority*fit*t.queue/(1+taken);
      if(sc>bs){bs=sc;best=t;}
    });
    if(best&&bs>1){
      a.assignment=best.id; a.status='working';
      a.floor=Math.floor(Math.random()*best.roles.length);
      a.dot.material.color.setHex(0xffcf5a);
      a.halo.material.map=GOLD_GLOW; a.halo.scale.setScalar(7.2);
      a.goal.set(best.cx+7,1.5,best.cz+7);
      setTime(hour);
    }
  });
}

/* ---------------- panel ---------------- */
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody');
function openTower(id){
  const t=towers.find(x=>x.id===id); if(!t)return;
  focus=id;
  towers.forEach(o=>{
    const on=o.id===id;
    o.slabs.visible=on;
    o.mesh.material.transparent=on;
    o.mesh.material.opacity=on?0.22:1;
    o.mesh.castShadow=!on;
    o.mesh.material.needsUpdate=true;
  });
  goal.target.set(t.cx,t.h*.5,t.cz); goal.r=t.h*1.8+36; goal.phi=1.05;
  const live=t.status==='live';
  const dist=D_LOOKUP[t.district]||{color:'#8a8aa0',name:t.district,icon:''};
  pbody.innerHTML=`
    <div class="st" style="color:${live?'#e2c05c':'#7a5060'}">${live?'verified — real execution':'stub — nothing runs here'}</div>
    <h2 style="color:${live?'#a3143a':'#7a5060'}"><span class="icon">${t.icon||''}</span>${t.name}</h2>
    <div class="meta">priority ${t.priority} &nbsp;·&nbsp; queue ${t.queue} &nbsp;·&nbsp; ${t.roles.length} role${t.roles.length===1?'':'s'}${t.primary?' &nbsp;·&nbsp; drawer app':''}</div>
    <span class="district" style="color:${dist.color}">${dist.icon} ${dist.name}</span>
    ${t.roles.map((r,i)=>{
      const who=agents.find(a=>a.assignment===t.id&&a.status==='working'&&a.floor===i);
      const col=who?'#e2c05c':'#3a2028';
      return `<div class="role">
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <span class="dot" style="background:${col};color:${col}"></span>
        <span class="r" style="color:${live?'#eedcd8':'#7a5060'}">${r}</span>
        <span class="who" style="color:${who?'#e2c05c':'#5a3040'}">${who?who.name:(live?'unstaffed':'not implemented')}</span>
      </div>`}).join('')}
    <div class="foot">${live
      ? (t.primary
        ? 'this is a drawer button — open BAM, tap the APPS drawer, and you land right here. agents route in on their own when there\'s real queue.'
        : 'backend service — no drawer button, but the district it lives in wires into it automatically.')
      : 'stub. the roles above are the spec — build one, set status to live, and the tower lights at night.'}</div>`;
  panel.classList.add('open');
}
function closeTower(){
  focus=null; panel.classList.remove('open');
  towers.forEach(o=>{o.slabs.visible=false;o.mesh.material.opacity=1;o.mesh.material.transparent=false;o.mesh.castShadow=true;});
  frameCity();
}
document.getElementById('close').onclick=closeTower;
document.getElementById('reset').onclick=closeTower;
addEventListener('keydown',e=>{if(e.key==='Escape')closeTower();});

/* ---------------- input ---------------- */
let drag=null;
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
const tip=document.getElementById('tip');
const cvs=renderer.domElement;

cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,btn:e.button,moved:0};cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('pointermove',e=>{
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(drag.btn===2||e.shiftKey){
      const f=cam.r*0.0016;
      const right=new THREE.Vector3().subVectors(camera.position,cam.target).cross(new THREE.Vector3(0,1,0)).normalize();
      goal.target.addScaledVector(right,-dx*f);
      const fwd=new THREE.Vector3().subVectors(cam.target,camera.position).setY(0).normalize();
      goal.target.addScaledVector(fwd,-dy*f);
    }else{
      goal.theta-=dx*0.006;
      goal.phi=Math.max(0.10,Math.min(1.50,goal.phi-dy*0.005));
    }
    drag.x=e.clientX; drag.y=e.clientY; tip.style.opacity=0; return;
  }
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  hover=hit?hit.object.userData.id:null;
  if(hover){
    const t=towers.find(x=>x.id===hover);
    const dist=D_LOOKUP[t.district]||{name:''};
    tip.textContent=`${t.icon||''} ${t.name.toUpperCase()} · ${t.status==='live'?'LIVE':'STUB'} · ${dist.name}`;
    tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity=1;
    cvs.style.cursor='pointer';
  }else{ tip.style.opacity=0; cvs.style.cursor='grab'; }
});
cvs.addEventListener('pointerup',e=>{
  const wasDrag=drag&&drag.moved>6, btn=drag?drag.btn:0; drag=null;
  if(wasDrag||btn!==0)return;
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  if(hit) openTower(hit.object.userData.id); else closeTower();
});
cvs.addEventListener('wheel',e=>{e.preventDefault();goal.r=Math.max(24,Math.min(3000,goal.r+e.deltaY*0.28));},{passive:false});

/* ---------------- bubbles ---------------- */
function updateBubbles(){
  msgs.forEach(m=>{
    m.life-=0.005;
    const a=agents.find(x=>x.id===m.from);
    if(!a||m.life<=0){ if(m.el){m.el.remove();m.el=null;} return; }
    if(!m.el){ m.el=document.createElement('div'); m.el.className='bub'; m.el.textContent=m.body; document.body.appendChild(m.el); }
    const v=a.obj.position.clone().add(new THREE.Vector3(0,3.8,0)).project(camera);
    if(v.z>1){m.el.style.opacity=0;return;}
    m.el.style.left=((v.x*.5+.5)*innerWidth)+'px';
    m.el.style.top=((-v.y*.5+.5)*innerHeight)+'px';
    m.el.style.opacity=Math.min(1,m.life);
  });
  msgs=msgs.filter(m=>m.life>0||m.el);
}

/* ---------------- loop ---------------- */
let tick=0;
function easeOutBack(t){ const c=1.4; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); }
function easeInQuad(t){ return t*t; }
function animate(){
  requestAnimationFrame(animate);
  clock+=0.016;
  applyCam();
  agents.forEach(a=>{
    a.obj.position.lerp(a.goal,0.03);
    if(a.lbl) a.lbl.material.rotation=0;
    if(a.status==='working'){
      a.halo.scale.setScalar(7.2*(1+0.26*Math.sin(clock*2.4+a.phase)));
      a.dot.position.y=Math.sin(clock*1.5+a.phase)*0.25;
    }
  });
  // growth animation — buildings rise/sink smoothly
  const toDispose=[];
  towers.forEach(t=>{
    if(!t.growth) return;
    const step=0.024;
    if(t.growth.t < t.growth.target){ t.growth.t=Math.min(t.growth.target, t.growth.t+step); }
    else if(t.growth.t > t.growth.target){ t.growth.t=Math.max(t.growth.target, t.growth.t-step*1.4); }
    // apply eased scale
    const eased = t.growth.target>0.5 ? easeOutBack(Math.max(0,Math.min(1,t.growth.t))) : easeInQuad(t.growth.t);
    t.group.scale.y = Math.max(0.001, eased);
    if(t.growth.target===0 && t.growth.t<=0.02) toDispose.push(t);
  });
  toDispose.forEach(disposeTower);

  beacons.forEach(b=>{
    const on = (Math.sin(clock*2.2+b.phase)+1)*0.5;
    b.mesh.material.opacity = b.baseOpacity * (0.25 + on*0.85);
    if(b.glow) b.glow.material.opacity = b.baseOpacity * (0.08 + on*0.45);
  });
  coreGlow.position.set(Math.sin(clock*0.2)*8,20,Math.cos(clock*0.2)*8);
  if(++tick%220===0) schedule();
  updateBubbles();
  renderer.render(scene,camera);
}

function toast(html){
  const box=document.getElementById('toasts');
  // cap: keep at most 4 on screen so long auto-grow sessions don't stack forever
  while(box.children.length>3) box.removeChild(box.firstChild);
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=html;
  box.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{t.classList.remove('on'); setTimeout(()=>t.remove(),400);},4200);
}

function swoop(cx, h, cz){
  goal.target.set(cx, h*0.5+2, cz);
  goal.r=Math.max(60, h*2.4+30);
  goal.phi=1.02;
  goal.theta=Math.atan2(cz-cx, cx-cz)-1.1;
  setTimeout(()=>{ if(!focus) frameCity(); }, 4500);
}

let idCounter=0;
function makeId(){
  idCounter++;
  return 'usr_'+Date.now().toString(36)+'_'+idCounter.toString(36)+'_'+Math.floor(Math.random()*1e6).toString(36);
}

function inventName(dId){
  const stems=NAME_STEMS[dId]||NAME_STEMS.ship;
  const existing=new Set(state.modules.map(m=>m.name.toLowerCase()));
  // try up to 40 random combinations — 240 possible per district makes collisions rare
  for(let i=0;i<40;i++){
    const name = NAME_PREFIX[Math.floor(Math.random()*NAME_PREFIX.length)]
               +' '+ stems[Math.floor(Math.random()*stems.length)];
    if(!existing.has(name.toLowerCase())) return name;
  }
  // extremely unlikely, but keep growth going with a timestamp suffix
  return NAME_PREFIX[Math.floor(Math.random()*NAME_PREFIX.length)]+' '+
         stems[Math.floor(Math.random()*stems.length)]+' '+
         Date.now().toString(36).slice(-3).toUpperCase();
}
function inventRoles(pool){
  // pull 3-4 role phrases from the pool, mixing across entries so no two buildings share a role set
  const bag=[];
  pool.forEach(p=>p[2].forEach(r=>bag.push(r)));
  const seen=new Set(); const out=[];
  while(out.length<3+Math.floor(Math.random()*2) && seen.size<bag.length){
    const r=bag[Math.floor(Math.random()*bag.length)];
    if(!seen.has(r)){ seen.add(r); out.push(r); }
  }
  return out;
}

function autoNew(){
  // round-robin: fill the smallest district first so the city grows evenly
  const counts={};
  state.modules.forEach(m=>{counts[m.district]=(counts[m.district]||0)+1});
  const cands=DISTRICTS.filter(d=>d.id!=='core').sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0));
  const dId=cands[0].id;
  const pool=NEW_IDEAS[dId]||NEW_IDEAS.ship;
  const existing=new Set(state.modules.map(m=>m.name.toLowerCase()));
  // prefer a fresh hand-crafted pool entry — feels human-designed
  const pick=pool.find(p=>!existing.has(p[0].toLowerCase()));
  let name, icon, roles;
  if(pick){
    [name,icon,roles]=pick;
    // fresh copies of roles so no shared reference
    roles=roles.slice();
  } else {
    // pool exhausted — invent a brand-new name (never a "Foo 2" copy)
    name = inventName(dId);
    const iconPool=DIST_ICONS[dId]||DIST_ICONS.ship;
    icon = iconPool[Math.floor(Math.random()*iconPool.length)];
    roles = inventRoles(pool);
  }
  return {
    id: makeId(),
    name, icon, district:dId,
    status: 'live',
    priority: 2+Math.floor(Math.random()*3),
    queue: 1+Math.floor(Math.random()*3),
    primary: false,
    roles
  };
}

function nextAgentName(){
  const taken=new Set(state.agents.map(a=>a.name));
  for(const n of AGENT_NAMES) if(!taken.has(n)) return n;
  // pool exhausted — number them so growth never stalls
  let n=state.agents.length+1;
  while(taken.has('AGENT-'+n)) n++;
  return 'AGENT-'+n;
}

  work:['money','strategy','markets','writing'],
  life:['coaching','morale','discipline'],
  security:['security','ops','code'],
  mind:['research','reasoning','memory','summarizing'],
  ship:['ops','code','tools','strategy'],
  senses:['voice','vision','messaging']
};

function spawnAgentsFor(mod){
  const distSkills=DISTRICT_SKILLS[mod.district]||['ops'];
  const modSkills=FIT[mod.id]||[];
  const skills=[...new Set([...distSkills, ...modSkills])].slice(0,3);
  const cnt = 1 + (mod.priority>=4 ? 1 : 0);   // 1-2 minds per building, more on high priority
  const spawned=[];
  for(let i=0;i<cnt;i++){
    const roleFloors = mod.roles ? mod.roles.length : 1;
    const a={
      id: 'ag_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6)+'_'+i,
      name: nextAgentName(),
      skills: skills.slice(),
      assignment: mod.id,
      status: 'working',
      floor: i % roleFloors
    };
    state.agents.push(a);
    spawned.push(a);
  }
  return spawned;
}

/* Add ONE agent's mesh to the scene without a full rebuild — cheap on the running frame */
function spawnAgentVisual(a, i){
  const work=a.status==='working';
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.7,16,16),
    new THREE.MeshBasicMaterial({color:work?0xffcf5a:0x604048}));
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({
    map:work?GOLD_GLOW:DIM_GLOW,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending}));
  halo.scale.setScalar(work?7.2:4);
  const lc=document.createElement('canvas'); lc.width=256; lc.height=64;
  const lx=lc.getContext('2d');
  lx.font='700 22px "Courier New",monospace';
  lx.textAlign='center'; lx.fillStyle=work?'#e2c05c':'#8a6070';
  lx.shadowColor='#000'; lx.shadowBlur=6;
  lx.fillText(a.name, 128, 34);
  const lt=new THREE.CanvasTexture(lc); lt.encoding=THREE.sRGBEncoding;
  const lbl=new THREE.Sprite(new THREE.SpriteMaterial({map:lt,transparent:true,depthWrite:false}));
  lbl.scale.set(6,1.5,1); lbl.position.set(0,2.6,0);
  const g=new THREE.Group(); g.add(dot); g.add(halo); g.add(lbl);
  const t=towers.find(x=>x.id===a.assignment);
  const home = t
    ? new THREE.Vector3(t.cx + 6 + (i||0)*2.4, 1.5, t.cz + 6 + (i||0)*2.4)
    : new THREE.Vector3(-150 + agents.length*8, 1.5, 150);
  g.position.copy(home); world.add(g);
  agents.push({...a, obj:g, dot, halo, lbl, goal:home.clone(), phase:Math.random()*6.28});
}

  const dId=cands[0].id;

const BamCity = {
  add(mod, opts={}){
    if(!mod||!mod.id||!mod.district) mod=Object.assign(autoNew(), mod||{});
    if(state.modules.some(m=>m.id===mod.id)){ this.update(mod.id, mod); return; }
    // buildings BAM adds are always live + staffed — otherwise the city fills with empty stubs
    if(!mod.status) mod.status='live';
    state.modules.push(mod);
    const t=addTower(mod);
    // spawn 1-2 minds to staff the new tower unless the caller opted out
    let spawned=[];
    if(!opts.noStaff && mod.status==='live'){
      spawned=spawnAgentsFor(mod);
      spawned.forEach((a,i)=>spawnAgentVisual(a,i));
      // refresh window textures on the new tower so lit-window ratio reflects the staff
      setTime(hour);
    }
    paintTruth(); paintDistricts(); save();
    if(!opts.quiet){
      const d=D_LOOKUP[mod.district]||{name:mod.district,color:'#e2c05c'};
      const crewLine = spawned.length ? ` — staffed by <span class="name">${spawned.map(a=>a.name).join(' + ')}</span>` : '';
      toast(`BAM built <span class="name" style="color:${d.color}">${mod.icon||'▦'} ${mod.name}</span> in ${d.name}${crewLine}`);
      if(!opts.noSwoop && !autoTimer) swoop(t.cx, t.h, t.cz);
    }
    return t;
  },
  update(id, patch){
    const m=state.modules.find(x=>x.id===id); if(!m) return;
    Object.assign(m, patch);
    const t=towers.find(x=>x.id===id); if(t) Object.assign(t, patch);
    setTime(hour); paintTruth(); save();
  },
  remove(id){
    state.modules=state.modules.filter(m=>m.id!==id);
    const t=towers.find(x=>x.id===id);
    if(t) t.growth={t:t.growth?t.growth.t:1, target:0};
    paintTruth(); paintDistricts(); save();
  },
  addAgent(a){
    if(!a||!a.id) return;
    if(state.agents.some(x=>x.id===a.id)) return;
    state.agents.push(a);
    // rebuild agent visuals (cheap — few agents)
    rebuildAgents();
    paintTruth(); save();
  },
  grow(){ return this.add(autoNew()); },
  startAuto(){ setAuto(true); },
  stopAuto(){ setAuto(false); },
  backfill(){ return backfillCity(); },
  state(){ return JSON.parse(JSON.stringify(state)); },
  save(){ save(); },
  load(json){
    try{ const parsed=typeof json==='string'?JSON.parse(json):json; ingest(parsed); usingSeed=false; save(); }
    catch(e){ toast('bad state JSON'); }
  },
  wipe(){ localStorage.removeItem(LS_KEY); ingest(SEED); usingSeed=true; paintTruth(); toast('city reset to seed'); }
};
window.BamCity = BamCity;

/* ═══════════════════════════════════════════════════════════════════
   BACKFILL — heal old saved cities:
   1) Rename duplicate names (invent unique replacements)
   2) Upgrade every user-added stub to live
   3) Staff every live tower that has zero working agents
   Then full rebuild so visuals reflect the changes.
═══════════════════════════════════════════════════════════════════ */
function backfillCity(){
  const changes={renamed:0, upgraded:0, staffed:0};

  // 1) dedupe by name (case-insensitive) — later dupes get a new invented name
  const seen=new Map();
  state.modules.forEach(m=>{
    const key=(m.name||'').toLowerCase();
    if(seen.has(key)){
      m.name=inventName(m.district);
      changes.renamed++;
    } else {
      seen.set(key, m);
    }
  });

  // 2) upgrade user-added stubs to live (seed stubs like Gumroad stay as-is —
  //    they reflect real BAM state that only the boss can unblock)
  state.modules.forEach(m=>{
    if(m.status==='stub' && (m.id||'').indexOf('usr_')===0){
      m.status='live';
      changes.upgraded++;
    }
  });

  // 3) staff every live tower with no working agent
  state.modules.forEach(m=>{
    if(m.status!=='live') return;
    const hasStaff=state.agents.some(a=>a.assignment===m.id && a.status==='working');
    if(!hasStaff){
      const spawned=spawnAgentsFor(m);
      changes.staffed+=spawned.length;
    }
  });

  // 4) full rebuild — dispose everything, re-add with new names/statuses/staff visible
  build();
  paintTruth(); paintDistricts(); save();
  return changes;
}

/* rebuild only the agents (cheaper than full build) */
function rebuildAgents(){
  agents.forEach(a=>{ world.remove(a.obj); });
  agents.length=0;
  state.agents.forEach((a,i)=>{
    const work=a.status==='working';
    const dot=new THREE.Mesh(new THREE.SphereGeometry(.7,16,16),
      new THREE.MeshBasicMaterial({color:work?0xffcf5a:0x604048}));
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({
      map:work?GOLD_GLOW:DIM_GLOW,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending}));
    halo.scale.setScalar(work?7.2:4);
    const lc=document.createElement('canvas'); lc.width=256; lc.height=64;
    const lx=lc.getContext('2d');
    lx.font='700 22px "Courier New",monospace';
    lx.textAlign='center'; lx.fillStyle=work?'#e2c05c':'#8a6070';
    lx.shadowColor='#000'; lx.shadowBlur=6;
    lx.fillText(a.name, 128, 34);
    const lt=new THREE.CanvasTexture(lc); lt.encoding=THREE.sRGBEncoding;
    const lbl=new THREE.Sprite(new THREE.SpriteMaterial({map:lt,transparent:true,depthWrite:false}));
    lbl.scale.set(6,1.5,1); lbl.position.set(0,2.6,0);
    const g=new THREE.Group(); g.add(dot); g.add(halo); g.add(lbl);
    const t=towers.find(x=>x.id===a.assignment);
    const home=t? new THREE.Vector3(t.cx+7,1.5,t.cz+7) : new THREE.Vector3(-150+i*8,1.5,150);
    g.position.copy(home); world.add(g);
    agents.push({...a,obj:g,dot,halo,lbl,goal:home.clone(),phase:Math.random()*6.28});
  });
}

/* ─── persistence ─── */
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function loadSaved(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

/* ─── poll city_state.json when hosted (skipped on file://) ─── */
let lastRemoteHash=null;
async function pollRemote(){
  if(location.protocol==='file:') return;
  try{
    const r=await fetch('city_state.json',{cache:'no-store'});
    if(!r.ok) return;
    const text=await r.text();
    let hash=0; for(let i=0;i<text.length;i++) hash=((hash<<5)-hash+text.charCodeAt(i))|0;
    if(hash===lastRemoteHash) return;
    lastRemoteHash=hash;
    const remote=JSON.parse(text);
    // diff-apply: add new modules with growth animation, remove missing
    const remoteIds=new Set((remote.modules||[]).map(m=>m.id));
    const localIds =new Set(state.modules.map(m=>m.id));
    (remote.modules||[]).forEach(m=>{
      if(!localIds.has(m.id)) BamCity.add(m);
      else BamCity.update(m.id, m);
    });
    state.modules.filter(m=>!remoteIds.has(m.id)).forEach(m=>BamCity.remove(m.id));
  }catch(e){}
}
setInterval(pollRemote, 30000);

/* ─── postMessage from parent iframe (BAM PWA can drive the city) ─── */
addEventListener('message', e=>{
  const d=e.data||{}; if(d.type!=='bam-city' || !d.action) return;
  const fn=BamCity[d.action]; if(typeof fn==='function') fn(d.arg);
});

/* ─── build modal wiring ─── */
const buildEl=document.getElementById('build'), backdrop=document.getElementById('backdrop');
function openBuild(){
  const dSel=document.getElementById('bDist');
  dSel.innerHTML=DISTRICTS.filter(d=>d.id!=='core').map(d=>
    `<option value="${d.id}">${d.icon} ${d.name}</option>`).join('');
  buildEl.classList.add('open'); backdrop.classList.add('open');
  document.getElementById('bName').focus();
}
function closeBuild(){ buildEl.classList.remove('open'); backdrop.classList.remove('open'); }
document.getElementById('grow').onclick=openBuild;
document.getElementById('bCancel').onclick=closeBuild;
backdrop.onclick=closeBuild;
document.getElementById('bRandom').onclick=()=>{
  const m=autoNew();
  document.getElementById('bDist').value=m.district;
  document.getElementById('bName').value=m.name;
  document.getElementById('bIcon').value=m.icon;
  document.getElementById('bStatus').value=m.status;
  document.getElementById('bPrio').value=m.priority;
  document.getElementById('bQueue').value=m.queue;
  document.getElementById('bPrimary').value=m.primary?'1':'0';
  document.getElementById('bRoles').value=m.roles.join(', ');
};
document.getElementById('bGo').onclick=()=>{
  const name=document.getElementById('bName').value.trim();
  if(!name){ document.getElementById('bName').focus(); return; }
  const id='usr_'+Date.now().toString(36);
  const roles=document.getElementById('bRoles').value.split(',').map(s=>s.trim()).filter(Boolean);
  BamCity.add({
    id, name,
    icon: document.getElementById('bIcon').value.trim() || '▦',
    district: document.getElementById('bDist').value,
    status: document.getElementById('bStatus').value,
    priority: parseInt(document.getElementById('bPrio').value)||3,
    queue: parseInt(document.getElementById('bQueue').value)||0,
    primary: document.getElementById('bPrimary').value==='1',
    roles: roles.length ? roles : ['(no roles declared)']
  });
  closeBuild();
  // clear form
  document.getElementById('bName').value=''; document.getElementById('bIcon').value='';
  document.getElementById('bRoles').value='';
};
document.getElementById('wipe').onclick=()=>{
  if(confirm('Wipe all of BAM\'s saved city changes and restore the seed?')) BamCity.wipe();
};
document.getElementById('fix').onclick=()=>{
  const c=BamCity.backfill();
  toast(`healed the city — <span class="name">${c.renamed} renamed · ${c.upgraded} upgraded · ${c.staffed} minds hired</span>`);
};

/* ─── auto-grow ─── */
const AUTO_KEY='bam-city-auto';
let autoTimer=null;
const autoBtn=document.getElementById('auto');
function setAuto(on){
  if(on){
    autoBtn.classList.add('on'); autoBtn.textContent='■ Auto';
    autoTimer=setInterval(()=>{ BamCity.grow(); }, 8000);
    localStorage.setItem(AUTO_KEY,'1');
  } else {
    autoBtn.classList.remove('on'); autoBtn.textContent='▶ Auto';
    if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
    localStorage.removeItem(AUTO_KEY);
  }
}
autoBtn.onclick=()=>setAuto(!autoTimer);

addEventListener('keydown',e=>{if(e.key==='Escape'&&buildEl.classList.contains('open'))closeBuild();});

(async()=>{
  resize();
  const saved=loadSaved();
  if(saved && saved.modules && saved.modules.length){
    ingest(saved); usingSeed=false;
    document.getElementById('note').textContent="loaded BAM's saved city (localStorage) — every ＋ Grow persists";
  } else {
    try{
      if(location.protocol!=='file:'){
        const r=await fetch('city_state.json',{cache:'no-store'});
        if(!r.ok)throw 0;
        ingest(await r.json()); usingSeed=false;
      } else { throw 0; }
    } catch(_){ ingest(SEED); usingSeed=true; }
  }
  // heal old saved cities — dedupe, upgrade user stubs, staff unstaffed live
  if(!usingSeed){
    const seen=new Set();
    let dupes=0, userStubs=0, unstaffed=0;
    state.modules.forEach(m=>{
      const k=(m.name||'').toLowerCase();
      if(seen.has(k)) dupes++; else seen.add(k);
      if(m.status==='stub' && (m.id||'').indexOf('usr_')===0) userStubs++;
      if(m.status==='live' && !state.agents.some(a=>a.assignment===m.id&&a.status==='working')) unstaffed++;
    });
    if(dupes || userStubs || unstaffed){
      const c=backfillCity();
      setTimeout(()=>{
        toast(`healed the city — <span class="name">${c.renamed} renamed · ${c.upgraded} upgraded to live · ${c.staffed} minds hired</span>`);
      }, 400);
    }
  }
  paintTruth(); setTime(10); animate();
  if(localStorage.getItem(AUTO_KEY)==='1') setAuto(true);
  console.log('%cBamCity ready','color:#e2c05c;font-weight:700',
    '— try  BamCity.grow()  ·  BamCity.backfill()  ·  ＋ Grow in the HUD');
})();
</script>
